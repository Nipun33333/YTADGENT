name: Daily YouTube Pipeline

on:
  workflow_dispatch:
    inputs:
      video_type:
        description: "Manual run mode. Use auto for the normal Asia/Kolkata weekday/weekend schedule."
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - shorts
          - long

  schedule:
    # Monday-Friday evenings: 3 Shorts.
    # The third slot is 00:30 IST on the following calendar day,
    # so the five weekday evening runs are represented by Tue-Sat 00:30.
    - cron: "0 20 * * 1-5"
      timezone: "Asia/Kolkata"

    - cron: "0 22 * * 1-5"
      timezone: "Asia/Kolkata"

    - cron: "30 0 * * 2-6"
      timezone: "Asia/Kolkata"

    # Saturday: 1 Long Video at 17:00 IST.
    - cron: "0 17 * * 6"
      timezone: "Asia/Kolkata"

    # Sunday: 1 Long Video at 17:00 IST.
    - cron: "0 17 * * 0"
      timezone: "Asia/Kolkata"

permissions:
  contents: write

# Serialize production runs so scheduled/manual jobs cannot race on
# YouTube quota, used_topics.txt, used_media.json, or git push.
concurrency:
  group: daily-youtube-pipeline-${{ github.event.schedule || github.run_id }}
  cancel-in-progress: false

jobs:
  create-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Force compatible MoviePy
        run: |
          python -m pip uninstall -y moviepy || true
          python -m pip install "moviepy==1.0.3"
          python -c "import moviepy; print('MoviePy version:', moviepy.__version__); import moviepy.editor; print('moviepy.editor import: OK')"

      - name: Install yt-dlp EJS
        run: |
          python -m pip install -U "yt-dlp[default]"

      - name: Verify YouTube OAuth before video generation
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python -m uploader.oauth_preflight

      - name: Resolve scheduled video type
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          MANUAL_VIDEO_TYPE: ${{ inputs.video_type }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -z "$MANUAL_VIDEO_TYPE" ] || [ "$MANUAL_VIDEO_TYPE" = "auto" ]; then
              echo "PIPELINE_VIDEO_TYPE=" >> "$GITHUB_ENV"
            else
              echo "PIPELINE_VIDEO_TYPE=$MANUAL_VIDEO_TYPE" >> "$GITHUB_ENV"
            fi
          elif [ "$SCHEDULE_CRON" = "0 20 * * 1-5" ] || [ "$SCHEDULE_CRON" = "0 22 * * 1-5" ] || [ "$SCHEDULE_CRON" = "30 0 * * 2-6" ]; then
            echo "PIPELINE_VIDEO_TYPE=shorts" >> "$GITHUB_ENV"
          else
            echo "PIPELINE_VIDEO_TYPE=long" >> "$GITHUB_ENV"
          fi

      - name: Run AI video pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          PIPELINE_TIMEZONE: Asia/Kolkata
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
          VIDEO_PRIVACY: public
        run: |
          python -m pipeline

      - name: Save pipeline history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add used_topics.txt used_media.json

          if git diff --cached --quiet; then
            echo "No new pipeline history to save"
          else
            git commit -m "Update YouTube pipeline history"
            git push
          fi
