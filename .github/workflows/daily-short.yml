name: Daily YouTube Pipeline

on:
  workflow_dispatch:

  schedule:
    # Monday-Sunday: 3 Shorts at 6:00 PM, 8:00 PM, and 10:00 PM IST.
    - cron: "0 18 * * *"
      timezone: "Asia/Kolkata"

    - cron: "0 20 * * *"
      timezone: "Asia/Kolkata"

    - cron: "0 22 * * *"
      timezone: "Asia/Kolkata"

permissions:
  contents: write

# Serialize production runs so scheduled/manual jobs cannot race on
# YouTube quota, used_topics.txt, used_media.json, or git push.
concurrency:
  group: daily-youtube-pipeline-${{ github.event.schedule || github.run_id }}
  cancel-in-progress: false

jobs:
  create-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare local TTS fallback voice
        run: python -m video.offline_tts --download

      - name: Force compatible MoviePy
        run: |
          python -m pip uninstall -y moviepy || true
          python -m pip install "moviepy==1.0.3"
          python -c "import moviepy; print('MoviePy version:', moviepy.__version__); import moviepy.editor; print('moviepy.editor import: OK')"

      - name: Install yt-dlp EJS
        run: |
          python -m pip install -U "yt-dlp[default]"

      - name: Verify YouTube OAuth before video generation
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python -m uploader.oauth_preflight

      - name: Run AI video pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          PIPELINE_TIMEZONE: Asia/Kolkata
          PIPELINE_VIDEO_TYPE: shorts
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
          VIDEO_PRIVACY: public
        run: |
          python -m pipeline

      - name: Save pipeline history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add used_topics.txt used_media.json

          if git diff --cached --quiet; then
            echo "No new pipeline history to save"
          else
            git commit -m "Update YouTube pipeline history"
            git push
          fi
