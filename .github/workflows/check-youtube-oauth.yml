name: Check YouTube OAuth

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-oauth:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal OAuth dependencies
        run: python -m pip install --disable-pip-version-check "google-auth>=2.0" "google-auth-oauthlib>=1.2.1" "python-dotenv>=1.0.0"
      - name: Verify YouTube OAuth credentials only
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python -m uploader.oauth_preflight
